# More information about the configuration file can be found here:
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default.global.parameters]
stack_name = "contact-messages"
profile = "lambda-practice"
region = "us-east-1"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "contact-messages"

# Used only by practice/run-tests.sh against the AWS Emulator, which wrongly denies
# every PutItem when the dynamodb:ReturnValues condition is in the policy.
[emulator.deploy.parameters]
parameter_overrides = "EnforceWriteOnly=false"
